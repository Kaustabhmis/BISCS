# Kunnect admin panel (Decap CMS) — https://decapcms.org/docs/
#
# Every save commits the edited JSON file in src/content/ to GitHub. Netlify
# then rebuilds and redeploys the site automatically (about 1–2 minutes).
# Setup steps: README → "Admin panel".

backend:
  name: github
  repo: Kaustabhmis/BISCS
  branch: main
  commit_messages:
    update: "Admin: update {{collection}} “{{slug}}”"
    uploadMedia: "Admin: upload “{{path}}”"
    deleteMedia: "Admin: delete “{{path}}”"

# Lets you use the panel on your own computer without logging in:
# run `npx decap-server` next to `npm run dev`, then open http://localhost:5173/admin/
local_backend: true

site_url: https://kunnectds.in
display_url: https://kunnectds.in
logo_url: /logo-mark.png

# Uploaded images (logos, photos) are stored in the repository and served from /uploads/.
media_folder: public/uploads
public_folder: /uploads

collections:
  # ─── Testimonials ─────────────────────────────────────────────────────────
  - name: testimonials
    label: Testimonials
    editor: { preview: false }
    files:
      - name: testimonials
        label: Customer testimonials
        file: src/content/testimonials.json
        description: >-
          Feedback cards on the home page. To approve a review sent through the
          website, copy it from Netlify → Forms → feedback (only if the customer
          ticked “I agree … may be published”). Never add invented reviews.
        fields:
          - name: items
            label: Testimonials
            label_singular: testimonial
            widget: list
            summary: "{{fields.name}} — {{fields.company}}"
            fields:
              - { label: Quote, name: quote, widget: text }
              - { label: Customer name, name: name, widget: string }
              - { label: Role, name: role, widget: string, required: false, hint: "e.g. Owner" }
              - { label: Company / business, name: company, widget: string, required: false }
              - { label: Rating (1–5), name: rating, widget: number, value_type: int, min: 1, max: 5, required: false, hint: "Only if the customer gave a rating" }
              - { label: Project / service, name: project, widget: string, required: false }
              - label: Customer photo
                name: portrait
                widget: object
                required: false
                collapsed: true
                fields:
                  - { label: Photo, name: src, widget: image, required: false }
                  - { label: Photo description (alt text), name: alt, widget: string, required: false }
              - label: Company logo
                name: logo
                widget: object
                required: false
                collapsed: true
                fields:
                  - { label: Logo, name: src, widget: image, required: false }
                  - { label: Logo description (alt text), name: alt, widget: string, required: false }
              - &placeholder
                label: Placeholder (removed when “Hide placeholder content” is on)
                name: placeholder
                widget: boolean
                required: false
                default: false

  # ─── Team ─────────────────────────────────────────────────────────────────
  - name: team
    label: Team
    editor: { preview: false }
    files:
      - name: team
        label: Team members
        file: src/content/team.json
        description: Shown on the About page. Remove all members to hide the section.
        fields:
          - name: items
            label: Team members
            label_singular: team member
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Short bio, name: bio, widget: text, required: false }
              - label: Photo
                name: portrait
                widget: object
                required: false
                collapsed: true
                hint: Portrait photos look best at 4:5 (e.g. 800×1000).
                fields:
                  - { label: Photo, name: src, widget: image, required: false }
                  - { label: Photo description (alt text), name: alt, widget: string, required: false }
              - label: Links
                name: links
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields: &link
                  - { label: Button text, name: label, widget: string }
                  - { label: Link (e.g. /contact or https://…), name: href, widget: string }
              - *placeholder

  # ─── Clients & collaborators ──────────────────────────────────────────────
  - name: brands
    label: Clients & collaborators
    editor: { preview: false }
    files:
      - name: brands
        label: Client and partner logos
        file: src/content/brands.json
        description: >-
          The moving logo strip on the home page. Only add brands you really
          work with and have permission to show. SVG or transparent PNG/WebP
          logos look best.
        fields:
          - name: items
            label: Brands
            label_singular: brand
            widget: list
            summary: "{{fields.name}} ({{fields.relationship}})"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Logo, name: logo, widget: image, required: false, hint: "Leave empty to show a neutral name badge" }
              - label: Relationship
                name: relationship
                widget: select
                default: client
                options:
                  - { label: Client, value: client }
                  - { label: Partner / collaborator, value: partner }
                  - { label: Platform, value: platform }
              - { label: Website link, name: href, widget: string, required: false }
              - *placeholder

  # ─── Services ─────────────────────────────────────────────────────────────
  - name: services
    label: Services
    editor: { preview: false }
    files:
      - name: services
        label: All services
        file: src/content/services.json
        description: >-
          Each service gets its own page at /services/<slug>, a contact-form
          option and a footer link automatically.
        fields:
          - label: Categories (in display order)
            name: categories
            widget: list
            field: { label: Category, name: category, widget: string }
          - name: items
            label: Services
            label_singular: service
            widget: list
            summary: "{{fields.title}} — {{fields.category}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: URL slug, name: slug, widget: string, hint: "Lowercase words with dashes, e.g. google-meta-ads. Changing it changes the page address." }
              - { label: Short name (for chips and the 3D hero), name: shortTitle, widget: string }
              - { label: Category, name: category, widget: string, hint: "Must match one of the categories above" }
              - label: Icon
                name: icon
                widget: select
                options: [id, camera, monitor, pin, search, star, message, megaphone, target, sparkles, calendar, user, whatsapp, users, share, pen, chart, layers, compass, zap, globe]
              - { label: One-line introduction, name: intro, widget: text }
              - label: Description paragraphs
                name: description
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
              - label: Benefits
                name: benefits
                widget: list
                field: { label: Benefit, name: benefit, widget: string }
              - label: Deliverables
                name: deliverables
                widget: list
                field: { label: Deliverable, name: deliverable, widget: string }
              - label: How it works (steps)
                name: process
                widget: list
                summary: "{{fields.title}}"
                fields: &titleText
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
              - label: Image (optional)
                name: image
                widget: object
                required: false
                collapsed: true
                fields:
                  - { label: Image, name: src, widget: image, required: false }
                  - { label: Image description (alt text), name: alt, widget: string, required: false }
              - label: Related case study (optional)
                name: caseStudy
                widget: object
                required: false
                collapsed: true
                fields:
                  - { label: Title, name: title, widget: string, required: false }
                  - { label: Summary, name: summary, widget: text, required: false }
                  - { label: Link, name: href, widget: string, required: false }
              - label: Button
                name: cta
                widget: object
                collapsed: true
                fields: *link
              - *placeholder

  # ─── Home page ────────────────────────────────────────────────────────────
  - name: home
    label: Home page
    editor: { preview: false }
    files:
      - name: home
        label: Home page text
        file: src/content/home.json
        fields:
          - label: Hero (top of the page)
            name: hero
            widget: object
            fields:
              - { label: Small text above the headline, name: eyebrow, widget: string }
              - { label: Headline, name: headline, widget: string }
              - { label: Gold words in the headline, name: headlineEmphasis, widget: string, hint: "Must appear exactly inside the headline" }
              - { label: Subheadline, name: subheadline, widget: text }
              - { label: Main button, name: primaryCta, widget: object, fields: *link }
              - { label: Second button, name: secondaryCta, widget: object, fields: *link }
              - label: Featured service card
                name: featuredService
                widget: object
                fields:
                  - { label: Small label, name: label, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Summary, name: summary, widget: string }
                  - { label: Link, name: href, widget: string }
              - label: Labels orbiting the 3D scene (3–8)
                name: channels
                widget: list
                field: { label: Label, name: label, widget: string }
              - { label: 3D scene description (for screen readers), name: sceneDescription, widget: text }
          - label: “Who we are” section
            name: intro
            widget: object
            fields:
              - { label: Section label, name: label, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Main statement, name: statement, widget: text }
              - { label: Philosophy / quote, name: philosophy, widget: string }
              - label: What makes us different
                name: differentiators
                widget: list
                summary: "{{fields.title}}"
                fields: *titleText
              - label: Statistics (only shown when “Verified” is ticked)
                name: stats
                widget: list
                required: false
                summary: "{{fields.value}} {{fields.label}}"
                fields:
                  - { label: Number, name: value, widget: string }
                  - { label: Label, name: label, widget: string }
                  - { label: Verified, name: verified, widget: boolean, default: false }
                  - *placeholder
              - { label: Button, name: cta, widget: object, fields: *link }
          - label: Clients & collaborators section
            name: brandsSection
            widget: object
            fields:
              - { label: Section label, name: label, widget: string }
              - { label: Heading, name: heading, widget: string }
          - label: Testimonials section
            name: testimonialsSection
            widget: object
            fields:
              - { label: Section label, name: label, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: “Share your experience” button, name: shareCta, widget: object, fields: *link }
          - label: Closing call to action (end of every page)
            name: closingCta
            widget: object
            fields:
              - { label: Small text, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Main button, name: primary, widget: object, fields: *link }
              - { label: Second button, name: secondary, widget: object, fields: *link }

  # ─── About page ───────────────────────────────────────────────────────────
  - name: about
    label: About page
    editor: { preview: false }
    files:
      - name: about
        label: About page text
        file: src/content/about.json
        description: Team members are edited under “Team”.
        fields:
          - { label: Section label, name: label, widget: string }
          - { label: Heading, name: heading, widget: string }
          - label: Company introduction (paragraphs)
            name: intro
            widget: list
            field: { label: Paragraph, name: paragraph, widget: text }
          - { label: Mission, name: mission, widget: text }
          - { label: Vision, name: vision, widget: text }
          - { label: Values, name: values, widget: list, summary: "{{fields.title}}", fields: *titleText }
          - { label: How we work (steps), name: methodology, widget: list, summary: "{{fields.title}}", fields: *titleText }
          - label: Milestones
            name: milestones
            widget: list
            required: false
            summary: "{{fields.year}} — {{fields.title}}"
            fields:
              - { label: Year, name: year, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
              - *placeholder
          - label: Awards & achievements (only shown when “Verified” is ticked)
            name: achievements
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Detail, name: detail, widget: text }
              - { label: Verified, name: verified, widget: boolean, default: false }
              - *placeholder

  # ─── Other pages ──────────────────────────────────────────────────────────
  - name: pages
    label: Other pages & forms
    editor: { preview: false }
    files:
      - name: pages
        label: Services, Contact, Feedback & legal pages
        file: src/content/pages.json
        fields:
          - label: Services page
            name: servicesPage
            widget: object
            fields:
              - { label: Section label, name: label, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Introduction, name: intro, widget: text }
          - label: Contact page
            name: contactPage
            widget: object
            fields:
              - { label: Section label, name: label, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Introduction, name: intro, widget: text }
              - { label: What happens next (steps), name: nextSteps, widget: list, summary: "{{fields.title}}", fields: *titleText }
          - label: Contact form
            name: contactForm
            widget: object
            fields:
              - { label: Button text, name: submitLabel, widget: string }
              - { label: Success heading, name: successTitle, widget: string }
              - { label: Success message, name: successText, widget: text }
              - { label: Error message, name: errorText, widget: text }
              - label: Budget options
                name: budgetOptions
                widget: list
                field: { label: Option, name: option, widget: string }
          - label: Feedback page
            name: feedbackPage
            widget: object
            fields:
              - { label: Section label, name: label, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Introduction, name: intro, widget: text }
              - label: Notes in the side panel
                name: notes
                widget: list
                field: { label: Note, name: note, widget: string }
          - label: Feedback form
            name: feedbackForm
            widget: object
            fields:
              - { label: Button text, name: submitLabel, widget: string }
              - { label: Success heading, name: successTitle, widget: string }
              - { label: Success message, name: successText, widget: text }
              - { label: Error message, name: errorText, widget: text }
          - label: Legal pages
            name: legal
            widget: object
            hint: While a page has no paragraphs it shows “awaiting content” and is hidden from search engines.
            fields:
              - label: Privacy policy
                name: privacy
                widget: object
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Paragraphs, name: body, widget: list, required: false, field: { label: Paragraph, name: paragraph, widget: text } }
              - label: Terms of use
                name: terms
                widget: object
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Paragraphs, name: body, widget: list, required: false, field: { label: Paragraph, name: paragraph, widget: text } }

  # ─── Company & contact ────────────────────────────────────────────────────
  - name: company
    label: Company & contact
    editor: { preview: false }
    files:
      - name: company
        label: Company details, contact & social links
        file: src/content/company.json
        fields:
          - label: Company
            name: brand
            widget: object
            fields:
              - { label: Full name, name: name, widget: string }
              - { label: Short name, name: shortName, widget: string }
              - { label: Small text after the wordmark, name: wordmarkSuffix, widget: string, required: false }
              - { label: Tagline / philosophy, name: tagline, widget: string }
              - label: Logo
                name: logo
                widget: object
                fields:
                  - { label: Logo image, name: src, widget: image, hint: "Wide logo on a transparent background (WebP, PNG or SVG)" }
                  - { label: Logo width in pixels, name: width, widget: number, required: false }
                  - { label: Logo height in pixels, name: height, widget: number, required: false }
          - label: Contact details (empty fields are hidden on the site)
            name: contact
            widget: object
            fields:
              - { label: Email, name: email, widget: string, required: false }
              - { label: Phone (as displayed), name: phone, widget: string, required: false, hint: "e.g. +91 79808 71878" }
              - { label: WhatsApp number, name: whatsapp, widget: string, required: false, hint: "Country code + number, digits only, e.g. 917980871878. Empty hides the WhatsApp buttons." }
              - { label: WhatsApp greeting message, name: whatsappMessage, widget: string, required: false }
              - { label: Office address, name: address, widget: text, required: false }
              - { label: Business hours, name: hours, widget: string, required: false }
              - { label: Map link, name: mapUrl, widget: string, required: false }
          - label: Social media links (empty links are hidden)
            name: socials
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Name, name: label, widget: string }
              - { label: Icon, name: icon, widget: select, options: [linkedin, instagram, facebook, x, youtube, link] }
              - { label: Link, name: href, widget: string, required: false }
          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Short introduction, name: blurb, widget: text }
          - label: Launch settings
            name: launch
            widget: object
            fields:
              - label: Hide placeholder content
                name: hidePlaceholderContent
                widget: boolean
                hint: Turn on before going live. Removes everything marked “Placeholder”.

  # ─── Brand colours ────────────────────────────────────────────────────────
  - name: theme
    label: Brand colours
    editor: { preview: false }
    files:
      - name: theme
        label: Colours
        file: src/content/theme.json
        description: >-
          Used across the whole site and the 3D scene. Keep enough contrast:
          “Accent text” must stay readable on the light background.
        fields:
          - { label: Background (dark), name: ink, widget: color, allowInput: true }
          - { label: Raised dark surface, name: inkRaised, widget: color, allowInput: true }
          - { label: Light background / text on dark, name: paper, widget: color, allowInput: true }
          - { label: Light surface (deeper), name: paperDeep, widget: color, allowInput: true }
          - { label: Muted text on dark, name: ash, widget: color, allowInput: true }
          - { label: Muted text on light, name: stone, widget: color, allowInput: true }
          - { label: Gold accent, name: accent, widget: color, allowInput: true }
          - { label: Accent text (on light backgrounds), name: accentInk, widget: color, allowInput: true }
          - { label: Highlight, name: signal, widget: color, allowInput: true }
          - { label: Gold — light shine, name: goldLight, widget: color, allowInput: true }
          - { label: Gold — deep shade, name: goldDeep, widget: color, allowInput: true }

  # ─── SEO ──────────────────────────────────────────────────────────────────
  - name: seo
    label: SEO
    editor: { preview: false }
    files:
      - name: seo
        label: Search & social settings
        file: src/content/seo.json
        fields:
          - { label: Website address, name: siteUrl, widget: string, hint: "e.g. https://kunnectds.in (no trailing slash)" }
          - { label: Locale, name: locale, widget: string }
          - { label: Social share image (1200×630), name: ogImage, widget: image }
          - { label: X / Twitter handle, name: twitterHandle, widget: string, required: false }
          - { label: Structured data for Google, name: structuredData, widget: boolean }
          - label: Page titles & descriptions
            name: pages
            widget: object
            hint: Titles under 60 characters and descriptions of 120–160 characters work best.
            fields:
              - { label: Home, name: home, widget: object, fields: [{ label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }] }
              - { label: Services, name: services, widget: object, fields: [{ label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }] }
              - { label: About, name: about, widget: object, fields: [{ label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }] }
              - { label: Contact, name: contact, widget: object, fields: [{ label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }] }
              - { label: Feedback, name: feedback, widget: object, fields: [{ label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }] }
              - { label: Page not found, name: notFound, widget: object, fields: [{ label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }] }
