# Netlify build configuration.
# `npm run build` builds the site and pre-renders every page to static HTML.
# Redirects (real 404s) and headers are generated into dist/_redirects and
# copied from public/_headers, so they also work for drag-and-drop deploys.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
