# Netlify configuration for BISCS India tools.
# The site is pre-built (HTML is committed), so there is no build command.
# To regenerate pages after editing assets/js/registry.js: node scripts/build.mjs
[build]
  publish = "."
  command = ""

[[redirects]]
  from = "https://biscsindia.com/*"
  to = "https://www.biscsindia.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
